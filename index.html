<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="commit" content="%VITE_COMMIT_SHA%" />
    <title>Sudoku</title>
    <script>
      // Theme before first paint, so a dark choice never flashes light: an explicit light or dark choice becomes
      // data-theme; system sets nothing and style.css follows prefers-color-scheme. Same rule as applyTheme in
      // src/ui/theme.ts; the key and field are sudoku.settings.theme (src/store/storage.ts).
      ;(function () {
        try {
          var t = (JSON.parse(localStorage.getItem('sudoku.settings')) || {}).theme
          if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
