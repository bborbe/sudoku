<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="commit" content="%VITE_COMMIT_SHA%" />
    <title>Sudoku</title>
    <script>
      // Theme before first paint, so a dark page never flashes light: `?theme=`, else the stored choice, else the OS
      // preference. Same rule as resolveTheme in src/ui/theme.ts and readUrl in src/ui/url-state.ts; the key and field
      // are sudoku.settings.theme (src/store/storage.ts).
      ;(function () {
        var t = new URLSearchParams(location.search).get('theme')
        try {
          if (t !== 'system' && t !== 'light' && t !== 'dark') t = (JSON.parse(localStorage.getItem('sudoku.settings')) || {}).theme
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
