<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="commit" content="%VITE_COMMIT_SHA%" />
    <title>Sudoku</title>
    <script>
      // Theme before first paint, so a dark choice never flashes light: `?theme=`, else the stored choice; an explicit
      // light or dark becomes data-theme, system sets nothing and style.css follows prefers-color-scheme. Same rule as
      // applyTheme in src/ui/theme.ts and readUrl in src/ui/url-state.ts; the key and field are sudoku.settings.theme
      // (src/store/storage.ts).
      ;(function () {
        try {
          var t = new URLSearchParams(location.search).get('theme')
          if (t !== 'system' && t !== 'light' && t !== 'dark') t = (JSON.parse(localStorage.getItem('sudoku.settings')) || {}).theme
          if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
          // Language likewise (src/i18n.ts, initialLang in src/ui/app.ts): `?lang=`, else the stored pick, else the browser.
          var l = new URLSearchParams(location.search).get('lang')
          if (l !== 'en' && l !== 'de') l = (JSON.parse(localStorage.getItem('sudoku.settings')) || {}).lang
          if (l !== 'en' && l !== 'de') l = (navigator.languages || [navigator.language || '']).some(function (x) { return /^de/i.test(x) }) ? 'de' : 'en'
          document.documentElement.lang = l
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
